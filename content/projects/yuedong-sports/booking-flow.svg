<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">场次预约与库存保护流程</title>
  <desc id="desc">用户选择场次后，后端按照不同库存类型加锁、校验、原子更新并创建订单。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffaf4"/><stop offset="1" stop-color="#eef8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#334155" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#172b4d">一次预约请求如何保护库存？</text>
  <g filter="url(#shadow)" font-family="Arial,'Microsoft YaHei',sans-serif">
    <rect x="60" y="150" width="180" height="100" rx="16" fill="#dff4ff" stroke="#55a9d6" stroke-width="2"/><text x="100" y="194" font-size="21" font-weight="700" fill="#15506d">选择场次</text><text x="86" y="224" font-size="14" fill="#31566d">session_id + quantity</text>
    <rect x="305" y="150" width="180" height="100" rx="16" fill="#e8e2ff" stroke="#826bd1" stroke-width="2"/><text x="354" y="194" font-size="21" font-weight="700" fill="#49368f">Redis 锁</text><text x="330" y="224" font-size="14" fill="#554a7e">按 id 排序获取</text>
    <rect x="550" y="150" width="180" height="100" rx="16" fill="#fff0da" stroke="#e7a24c" stroke-width="2"/><text x="583" y="194" font-size="21" font-weight="700" fill="#7d4b08">事务校验</text><text x="573" y="224" font-size="14" fill="#765427">状态 / 重复 / 权益</text>
    <rect x="795" y="100" width="310" height="145" rx="16" fill="#e2f6e8" stroke="#69b783" stroke-width="2"/><text x="871" y="143" font-size="21" font-weight="700" fill="#24613a">数据库条件更新</text><text x="826" y="176" font-size="15" fill="#467355">普通：available → reserved</text><text x="826" y="202" font-size="15" fill="#467355">容量：used + n ≤ total</text><text x="826" y="228" font-size="15" fill="#467355">会员：校验并记录 usage</text>
    <rect x="795" y="340" width="310" height="145" rx="16" fill="#ffe5ea" stroke="#d56b7e" stroke-width="2"/><text x="865" y="383" font-size="21" font-weight="700" fill="#823849">创建交易事实</text><text x="826" y="416" font-size="15" fill="#8b4a57">order + order_item</text><text x="826" y="442" font-size="15" fill="#8b4a57">snapshot + session_reg</text><text x="826" y="468" font-size="15" fill="#8b4a57">支付单 / 会员 usage</text>
    <rect x="550" y="385" width="180" height="100" rx="16" fill="#fff7d8" stroke="#d5b83f" stroke-width="2"/><text x="590" y="429" font-size="21" font-weight="700" fill="#76620a">支付或凭证</text><text x="583" y="459" font-size="14" fill="#83752c">成功 / 待支付 / 退款</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M240 200H305"/><path d="M485 200H550"/><path d="M730 190H795"/><path d="M950 245V340"/><path d="M795 420H730"/>
  </g>
  <text x="60" y="575" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#52647d">锁负责互斥，事务负责跨表一致，条件更新负责在数据库层拒绝超卖；三者解决的问题不同。</text>
</svg>
